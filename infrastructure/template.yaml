AWSTemplateFormatVersion: "2010-09-09"

Description: >
  Lambda sencilla creada con CloudFormation para aprender
  Infrastructure as Code.

Parameters:
  EnvironmentName:
    Type: String
    Default: dev
    AllowedValues:
      - dev
      - prod
    Description: Ambiente donde se desplegara la aplicacion.

Resources:
  LambdaExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: AllowLambdaToAssumeRole
            Effect: Allow
            Principal:
              Service:
                - lambda.amazonaws.com
            Action:
              - sts:AssumeRole

      ManagedPolicyArns:
        - !Sub arn:${AWS::Partition}:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole

      Policies:
        - PolicyName: SendMessagesToSupportJobsQueue
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: AllowSendingSupportJobs
                Effect: Allow
                Action:
                  - sqs:SendMessage
                Resource: arn:aws:sqs:us-east-1:214078205303:ai-customer-support-jobs-dev

      Tags:
        - Key: Environment
          Value: !Ref EnvironmentName
        - Key: Project
          Value: hello-lambda

  ApiLambdaFunction:
    Type: AWS::Lambda::Function
    DependsOn:
      - ApiLambdaLogGroup
    Properties:
      FunctionName: !Sub ai-customer-support-agent-${EnvironmentName}
      Description: Lambda creada completamente mediante CloudFormation.
      Runtime: python3.14
      Handler: functions.api.handler.handler
      Role: !GetAtt LambdaExecutionRole.Arn
      Code: ../src/
      MemorySize: 128
      Timeout: 10

      Environment:
        Variables:
          APP_ENV: !Ref EnvironmentName
          SERVICE_NAME: ai-customer-support-agent
          LOG_LEVEL: INFO
          SUPPORT_JOBS_QUEUE_URL: https://sqs.us-east-1.amazonaws.com/214078205303/ai-customer-support-jobs-dev
          BEDROCK_MODEL_ID: amazon.nova-micro-v1:0
          KNOWLEDGE_BASE_ID: !Ref SupportKnowledgeBase
          AGENTCORE_RUNTIME_ARN: !GetAtt SupportAgentRuntime.AgentRuntimeArn
          AGENTCORE_MEMORY_ID: !GetAtt SupportAgentMemory.MemoryId

      Tags:
        - Key: Environment
          Value: !Ref EnvironmentName
        - Key: Project
          Value: hello-lambda

  ApiLambdaLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /aws/lambda/ai-customer-support-agent-${EnvironmentName}
      RetentionInDays: 14


  SupportHttpApi:
    Type: AWS::ApiGatewayV2::Api
    Properties:
      Name: !Sub ai-customer-support-agent-api-${EnvironmentName}
      Description: HTTP API for the AI Customer Support Agent
      ProtocolType: HTTP
  
  ApiLambdaIntegration:
    Type: AWS::ApiGatewayV2::Integration
    Properties:
      ApiId: !Ref SupportHttpApi
      Description: Lambda proxy integration for the support API
      IntegrationType: AWS_PROXY
      IntegrationUri: !Sub
        - arn:${AWS::Partition}:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${FunctionArn}/invocations
        - FunctionArn: !GetAtt ApiLambdaFunction.Arn
      PayloadFormatVersion: "2.0"
      TimeoutInMillis: 10000

  HealthRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref SupportHttpApi
      AuthorizationType: NONE
      RouteKey: GET /health
      Target: !Sub integrations/${ApiLambdaIntegration}

  ChatRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref SupportHttpApi
      AuthorizationType: NONE
      RouteKey: POST /chat
      Target: !Sub integrations/${ApiLambdaIntegration}

  DefaultRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref SupportHttpApi
      AuthorizationType: NONE
      RouteKey: $default
      Target: !Sub integrations/${ApiLambdaIntegration}

  ApiGatewayAccessLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /aws/apigateway/ai-customer-support-agent-${EnvironmentName}
      RetentionInDays: 14

  ApiDefaultStage:
    Type: AWS::ApiGatewayV2::Stage
    DependsOn:
      - ApiGatewayAccessLogGroup
    Properties:
      ApiId: !Ref SupportHttpApi
      StageName: $default
      AutoDeploy: true
      AccessLogSettings:
        DestinationArn: !GetAtt ApiGatewayAccessLogGroup.Arn
        Format: '{"request_id":"$context.requestId","method":"$context.httpMethod","route_key":"$context.routeKey","path":"$context.path","status":"$context.status","response_length":"$context.responseLength","response_latency":"$context.responseLatency","source_ip":"$context.identity.sourceIp"}'

  ApiGatewayInvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref ApiLambdaFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub
        - arn:${AWS::Partition}:execute-api:${AWS::Region}:${AWS::AccountId}:${ApiId}/*
        - ApiId: !Ref SupportHttpApi
  
  WorkerLambdaExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: AllowLambdaToAssumeRole
            Effect: Allow
            Principal:
              Service:
                - lambda.amazonaws.com
            Action:
              - sts:AssumeRole

      ManagedPolicyArns:
        - !Sub arn:${AWS::Partition}:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole

      Policies:
        - PolicyName: ConsumeSupportJobsQueue
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: AllowConsumingSupportJobs
                Effect: Allow
                Action:
                  - sqs:ReceiveMessage
                  - sqs:DeleteMessage
                  - sqs:GetQueueAttributes
                Resource: arn:aws:sqs:us-east-1:214078205303:ai-customer-support-jobs-dev
        - PolicyName: CommunicationWithBedrock
          PolicyDocument: 
            Version: "2012-10-17"
            Statement:
              - Sid: AllowInvokeSupportAgentRuntime
                Effect: Allow
                Action:
                  - bedrock-agentcore:InvokeAgentRuntime
                Resource: 
                  - !GetAtt SupportAgentRuntime.AgentRuntimeArn
                  - !Sub 
                    - "${RuntimeArn}/runtime-endpoint/DEFAULT"
                    - RuntimeArn: !GetAtt SupportAgentRuntime.AgentRuntimeArn

      Tags:
        - Key: Environment
          Value: !Ref EnvironmentName
        - Key: Project
          Value: ai-customer-support-agent

  SupportJobsWorkerLambdaFunction:
    Type: AWS::Lambda::Function
    DependsOn:
      - WorkerLambdaLogGroup
    Properties:
      FunctionName: !Sub ai-customer-support-worker-${EnvironmentName}
      Description: Processes support jobs pulled from SQS.
      Runtime: python3.14
      Handler: functions.worker.handler.handler
      Role: !GetAtt WorkerLambdaExecutionRole.Arn
      Code: ../src/
      MemorySize: 128
      Timeout: 30

      Environment:
        Variables:
          APP_ENV: !Ref EnvironmentName
          SERVICE_NAME: ai-customer-support-worker
          LOG_LEVEL: INFO
          SUPPORT_JOBS_QUEUE_URL: https://sqs.us-east-1.amazonaws.com/214078205303/ai-customer-support-jobs-dev
          BEDROCK_MODEL_ID: amazon.nova-micro-v1:0
          KNOWLEDGE_BASE_ID: !Ref SupportKnowledgeBase
          AGENTCORE_RUNTIME_ARN: !GetAtt SupportAgentRuntime.AgentRuntimeArn
          AGENTCORE_MEMORY_ID: !GetAtt SupportAgentMemory.MemoryId

      Tags:
        - Key: Environment
          Value: !Ref EnvironmentName
        - Key: Project
          Value: ai-customer-support-agent
  
  WorkerLambdaLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /aws/lambda/ai-customer-support-worker-${EnvironmentName}
      RetentionInDays: 14

  SupportJobsEventSourceMapping:
    Type: AWS::Lambda::EventSourceMapping
    Properties:
      EventSourceArn: arn:aws:sqs:us-east-1:214078205303:ai-customer-support-jobs-dev
      FunctionName: !Ref SupportJobsWorkerLambdaFunction
      Enabled: true
      BatchSize: 5
      FunctionResponseTypes:
        - ReportBatchItemFailures
  
  KnowledgeBaseSourceBucket:
    Type: AWS::S3::Bucket
  
  KnowledgeBaseVectorBucket:
    Type: AWS::S3Vectors::VectorBucket
    Properties:
      VectorBucketName: !Sub squad-prep-ai-customer-support-knowledge-base-vectors-${EnvironmentName}
  
  KnowledgeBaseVectorIndex:
    Type: AWS::S3Vectors::Index
    Properties:
      VectorBucketArn: !Ref KnowledgeBaseVectorBucket
      IndexName: knowledge-base-index
      DataType: float32
      Dimension: 1024
      DistanceMetric: cosine

  KnowledgeBaseServiceRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service:
                - bedrock.amazonaws.com
            Action:
              - sts:AssumeRole

      Policies:
        - PolicyName: IngestDocsForRAG
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: AllowListSourceBucket
                Effect: Allow
                Action:
                  - s3:ListBucket
                Resource: !GetAtt KnowledgeBaseSourceBucket.Arn

              - Sid: AllowReadFromSourceBucket
                Effect: Allow
                Action:
                  - s3:GetObject
                Resource: !Sub "${KnowledgeBaseSourceBucket.Arn}/*"

              - Sid: AllowInvokeEmbeddingModel
                Effect: Allow
                Action:
                  - bedrock:InvokeModel
                Resource: !Sub arn:${AWS::Partition}:bedrock:${AWS::Region}::foundation-model/amazon.titan-embed-text-v2:0

              - Sid: AllowAccessToVectorIndex
                Effect: Allow
                Action:
                  - s3vectors:PutVectors
                  - s3vectors:GetVectors
                  - s3vectors:DeleteVectors
                  - s3vectors:QueryVectors
                  - s3vectors:GetIndex
                Resource: !GetAtt KnowledgeBaseVectorIndex.IndexArn

      Tags:
        - Key: Environment
          Value: !Ref EnvironmentName
        - Key: Project
          Value: ai-customer-support-agent
  
  SupportKnowledgeBase:
    Type: AWS::Bedrock::KnowledgeBase
    Properties:
      Name: !Sub ai-customer-support-knowledge-base-${EnvironmentName}
      RoleArn: !GetAtt KnowledgeBaseServiceRole.Arn
      KnowledgeBaseConfiguration:
        Type: VECTOR
        VectorKnowledgeBaseConfiguration:
          EmbeddingModelArn: !Sub arn:${AWS::Partition}:bedrock:${AWS::Region}::foundation-model/amazon.titan-embed-text-v2:0
      StorageConfiguration:
        Type: S3_VECTORS
        S3VectorsConfiguration:
          IndexArn: !GetAtt KnowledgeBaseVectorIndex.IndexArn
  
  SupportKnowledgeBaseDataSource:
    Type: AWS::Bedrock::DataSource
    Properties:
      Name: !Sub ai-customer-support-knowledge-base-data-source-${EnvironmentName}
      KnowledgeBaseId: !Ref SupportKnowledgeBase
      DataDeletionPolicy: DELETE
      DataSourceConfiguration:
        Type: S3
        S3Configuration:
          BucketArn: !GetAtt KnowledgeBaseSourceBucket.Arn

  AgentCoreExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: AllowAgentCoreToAssumeRole
            Effect: Allow
            Principal:
              Service:
                - bedrock-agentcore.amazonaws.com
            Action:
              - sts:AssumeRole
            Condition:
              StringEquals:
                aws:SourceAccount: !Ref AWS::AccountId
              ArnLike:
                aws:SourceArn: !Sub arn:${AWS::Partition}:bedrock-agentcore:${AWS::Region}:${AWS::AccountId}:*

      Policies:
        - PolicyName: AgentRuntimePermissions
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: AllowBedrockInference
                Effect: Allow
                Action:
                  - bedrock:InvokeModel
                Resource: !Sub arn:${AWS::Partition}:bedrock:${AWS::Region}::foundation-model/amazon.nova-micro-v1:0

              - Sid: AllowKnowledgeBaseRetrieval
                Effect: Allow
                Action:
                  - bedrock:Retrieve
                Resource: !GetAtt SupportKnowledgeBase.KnowledgeBaseArn
              - Sid: AllowReadAgentRuntimeArtifact
                Effect: Allow
                Action:
                  - s3:GetObject
                Resource: !Sub "${AgentCoreCodeBucket.Arn}/*"
              - Sid: AllowAgentCoreCreateLogGroups
                Effect: Allow
                Action:
                  - logs:CreateLogGroup
                  - logs:DescribeLogStreams
                Resource:
                  - !Sub arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/bedrock-agentcore/runtimes/*
              - Sid: AllowAgentCoreDescribeLogGroups
                Effect: Allow
                Action:
                  - logs:DescribeLogGroups
                Resource:
                  - !Sub arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:*
              - Sid: AllowAgentCoreWriteLogs
                Effect: Allow
                Action:
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource:
                  - !Sub arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/bedrock-agentcore/runtimes/*:log-stream:*
              - Sid: AllowAgentCoreXRay
                Effect: Allow
                Action:
                  - xray:PutTraceSegments
                  - xray:PutTelemetryRecords
                  - xray:GetSamplingRules
                  - xray:GetSamplingTargets
                Resource: "*"
              - Sid: AllowAgentCoreMetrics
                Effect: Allow
                Action:
                  - cloudwatch:PutMetricData
                Resource: "*"
                Condition:
                  StringEquals:
                    cloudwatch:namespace: bedrock-agentcore
              - Sid: AllowAgentCoreShortTermMemory
                Effect: Allow
                Action:
                  - bedrock-agentcore:CreateEvent
                  - bedrock-agentcore:ListEvents
                Resource:
                  - !GetAtt SupportAgentMemory.MemoryArn

      Tags:
        - Key: Environment
          Value: !Ref EnvironmentName
        - Key: Project
          Value: ai-customer-support-agent

  AgentCoreCodeBucket:
    Type: AWS::S3::Bucket

  SupportAgentRuntime:
    Type: AWS::BedrockAgentCore::Runtime
    Properties:
      AgentRuntimeName: !Sub ai_customer_support_agent_${EnvironmentName}

      Description: Runtime for the AI Customer Support Agent

      RoleArn: !GetAtt AgentCoreExecutionRole.Arn

      AgentRuntimeArtifact:
        CodeConfiguration:
          Code:
            S3:
              Bucket: !Ref AgentCoreCodeBucket
              Prefix: agentcore-runtime-v12.zip
          Runtime: PYTHON_3_14
          EntryPoint:
            - agentcore_app.py

      NetworkConfiguration:
        NetworkMode: PUBLIC

      EnvironmentVariables:
        APP_ENV: !Ref EnvironmentName
        SERVICE_NAME: ai-customer-support-agentcore
        LOG_LEVEL: INFO
        SUPPORT_JOBS_QUEUE_URL: https://sqs.us-east-1.amazonaws.com/214078205303/ai-customer-support-jobs-dev
        BEDROCK_MODEL_ID: amazon.nova-micro-v1:0
        KNOWLEDGE_BASE_ID: !Ref SupportKnowledgeBase
        AGENTCORE_MEMORY_ID: !GetAtt SupportAgentMemory.MemoryId

      Tags:
        Environment: !Ref EnvironmentName
        Project: ai-customer-support-agent
  
  SupportAgentMemory:
    Type: AWS::BedrockAgentCore::Memory
    Properties:
      Name: !Sub ai_customer_support_memory_${EnvironmentName}
      Description: Short-term conversational memory for the customer support agent
      EventExpiryDuration: 30
      Tags:
        Environment: !Ref EnvironmentName
        Project: ai-customer-support-agent

  AgentCoreGatewayExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service:
                - bedrock-agentcore.amazonaws.com
            Action:
              - sts:AssumeRole
      
      Policies:
      - PolicyName: InvokeGatewayToolsLambda
        PolicyDocument:
          Version: "2012-10-17"
          Statement:
            - Effect: Allow
              Action:
                - lambda:InvokeFunction
              Resource: !GetAtt GatewayToolsLambdaFunction.Arn

  SupportToolsGateway:
    Type: AWS::BedrockAgentCore::Gateway
    Properties:
      Name: !Sub ai-customer-support-gateway-${EnvironmentName}
      Description: Gateway for customer support agent tools
      RoleArn: !GetAtt AgentCoreGatewayExecutionRole.Arn
      ProtocolType: MCP
      AuthorizerType: NONE
  
  GatewayToolsLambdaFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub ai-customer-support-gateway-tools-${EnvironmentName}
      Runtime: python3.14
      Handler: functions.gateway_tools.handler.handler
      Role: !GetAtt GatewayToolsLambdaExecutionRole.Arn
      Code: ../src/

  GatewayToolsLambdaExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service:
                - lambda.amazonaws.com
            Action:
              - sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
  
  SupportToolsGatewayTarget:
    Type: AWS::BedrockAgentCore::GatewayTarget
    Properties:
      Name: !Sub support-tools-${EnvironmentName}
      GatewayIdentifier: !GetAtt SupportToolsGateway.GatewayIdentifier
      CredentialProviderConfigurations:
        - CredentialProviderType: GATEWAY_IAM_ROLE
      TargetConfiguration:
        Mcp:
          Lambda:
            LambdaArn: !GetAtt GatewayToolsLambdaFunction.Arn
            ToolSchema:
              InlinePayload:
                - Name: get_order
                  Description: Get the current status of an order
                  InputSchema:
                    Type: object
                    Properties:
                      order_id:
                        Type: string
                    Required:
                      - order_id
  



Outputs:
  LambdaFunctionName:
    Description: Nombre fisico de la funcion Lambda.
    Value: !Ref ApiLambdaFunction

  LambdaFunctionArn:
    Description: ARN de la funcion Lambda.
    Value: !GetAtt ApiLambdaFunction.Arn

  LambdaExecutionRoleName:
    Description: Nombre del execution role.
    Value: !Ref LambdaExecutionRole

  LambdaExecutionRoleArn:
    Description: ARN del execution role.
    Value: !GetAtt LambdaExecutionRole.Arn

  ApiId:
    Description: ID of the API Gateway HTTP API
    Value: !Ref SupportHttpApi

  ApiUrl:
    Description: Base URL of the API
    Value: !Sub https://${SupportHttpApi}.execute-api.${AWS::Region}.${AWS::URLSuffix}

  HealthUrl:
    Description: Health endpoint URL
    Value: !Sub https://${SupportHttpApi}.execute-api.${AWS::Region}.${AWS::URLSuffix}/health

  ChatUrl:
    Description: Chat endpoint URL
    Value: !Sub https://${SupportHttpApi}.execute-api.${AWS::Region}.${AWS::URLSuffix}/chat

  SupportJobsQueueUrl:
    Description: Main Queue URL
    Value: https://sqs.us-east-1.amazonaws.com/214078205303/ai-customer-support-jobs-dev

  SupportJobsQueueArn:
    Description: Main Queue ARN
    Value: arn:aws:sqs:us-east-1:214078205303:ai-customer-support-jobs-dev

  SupportJobsWorkerFunctionName:
    Description: Worker Lambda function name
    Value: !Ref SupportJobsWorkerLambdaFunction

  SupportJobsWorkerFunctionArn:
    Description: Worker Lambda function ARN
    Value: !GetAtt SupportJobsWorkerLambdaFunction.Arn

  SupportJobsWorkerExecutionRoleName:
    Description: Worker Lambda execution role name
    Value: !Ref WorkerLambdaExecutionRole

  SupportJobsWorkerExecutionRoleArn:
    Description: Worker Lambda execution role ARN
    Value: !GetAtt WorkerLambdaExecutionRole.Arn

  KnowledgeBaseSourceBucketName:
    Description: S3 bucket containing the Knowledge Base source documents
    Value: !Ref KnowledgeBaseSourceBucket

  KnowledgeBaseId:
    Description: Bedrock Knowledge Base ID
    Value: !Ref SupportKnowledgeBase

  KnowledgeBaseDataSourceId:
    Description: Bedrock Knowledge Base data source ID
    Value: !GetAtt SupportKnowledgeBaseDataSource.DataSourceId

  AgentCoreCodeBucketName:
    Description: S3 bucket for AgentCore runtime deployment artifacts
    Value: !Ref AgentCoreCodeBucket
  
  AgentCoreRuntimeId:
    Description: AgentCore Runtime ID
    Value: !GetAtt SupportAgentRuntime.AgentRuntimeId

  AgentCoreRuntimeArn:
    Description: AgentCore Runtime ARN
    Value: !GetAtt SupportAgentRuntime.AgentRuntimeArn

  AgentCoreMemoryId:
    Description: AgentCore Memory ID
    Value: !GetAtt SupportAgentMemory.MemoryId

  AgentCoreMemoryArn:
    Description: AgentCore Memory ARN
    Value: !GetAtt SupportAgentMemory.MemoryArn

  AgentCoreGatewayId:
    Description: AgentCore Gateway ID
    Value: !GetAtt SupportToolsGateway.GatewayIdentifier

  AgentCoreGatewayUrl:
    Description: AgentCore Gateway URL
    Value: !GetAtt SupportToolsGateway.GatewayUrl